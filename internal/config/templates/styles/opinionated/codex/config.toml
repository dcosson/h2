# Codex profile configuration
# Intentionally minimal placeholder; add values as needed.

# Pin the model to cap the effective context window near ~258k tokens.
# Codex has no standalone context/compaction override; the model IS the window
# (gpt-5.6-sol ≈ 258k, gpt-6-astra ≈ 353k), so pinning the model is the lever.
model = "gpt-5.6-sol"

[notice]
hide_rate_limit_model_nudge = true

# Trust the scoped GitHub Codex App credentials for all GitHub app tools by default.
# Keep the merge tool disabled so agents can open/update PRs without manual approval,
# but cannot merge pull requests through the app connector.
[apps.connector_76869538009648d5b282a4bb21c3d157]
default_tools_approval_mode = "approve"

[apps.connector_76869538009648d5b282a4bb21c3d157.tools."github.merge_pull_request"]
enabled = false
